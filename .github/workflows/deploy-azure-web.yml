name: Deploy CaseLink to Azure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check the public site, test the Azure connection, or deploy this main commit
        type: choice
        options:
          - check
          - connect
          - deploy
        default: check
        required: true

permissions:
  contents: read

concurrency:
  group: caselink-azure-web
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'Will-Sanz/case-link' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check the public site
        run: python3 deploy/parent-vm/azure-web-release.py check
      - name: Require successful main checks for this exact commit
        if: inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in ci.yml codeql.yml; do
            run_id=$(gh run list --workflow "$workflow" --branch main --event push --commit "$GITHUB_SHA" --limit 1 --json databaseId,headSha --jq ".[0] | select(.headSha == \"$GITHUB_SHA\") | .databaseId")
            if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
              echo "No $workflow push run found for $GITHUB_SHA."
              exit 1
            fi
            state=""
            for ((attempt = 0; attempt < 112; attempt++)); do
              state=$(gh run view "$run_id" --json headSha,status,conclusion --jq '[.headSha,.status,.conclusion] | join(":")')
              if [[ "$state" == "$GITHUB_SHA:completed:"* ]]; then break; fi
              sleep 15
            done
            test "$state" = "$GITHUB_SHA:completed:success"
          done

  azure:
    if: inputs.operation == 'connect' || inputs.operation == 'deploy'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: caselink-azure-web
      url: https://www.thecaselink.com
    permissions:
      contents: read
      id-token: write
    outputs:
      build: ${{ steps.release.outputs.build }}
      old_build: ${{ steps.release.outputs.old_build }}
      previous: ${{ steps.release.outputs.previous }}
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CORE_COLLECT_TELEMETRY: '0'
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sign in to Azure with GitHub OpenID Connect
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run the selected operation
        id: release
        env:
          OPERATION: ${{ inputs.operation }}
        run: python3 deploy/parent-vm/azure-web-release.py "$OPERATION" --sha "$GITHUB_SHA"

  smoke:
    if: inputs.operation == 'deploy'
    needs: azure
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node for live browser checks
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Verify the exact live build on desktop and phone
        env:
          BUILD: ${{ needs.azure.outputs.build }}
        run: python3 deploy/parent-vm/azure-web-release.py verify --build "$BUILD"

  rollback:
    if: always() && needs.azure.result == 'success' && needs.azure.outputs.release_id != '' && (needs.smoke.result == 'failure' || needs.smoke.result == 'cancelled')
    needs: [azure, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: caselink-azure-web
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CORE_COLLECT_TELEMETRY: '0'
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Sign in to Azure with GitHub OpenID Connect
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Restore the last healthy build
        env:
          PREVIOUS: ${{ needs.azure.outputs.previous }}
          OLD_BUILD: ${{ needs.azure.outputs.old_build }}
          RELEASE_ID: ${{ needs.azure.outputs.release_id }}
        run: |
          python3 deploy/parent-vm/azure-web-release.py rollback --sha "$GITHUB_SHA" \
            --previous "$PREVIOUS" --old-build "$OLD_BUILD" --release-id "$RELEASE_ID"
