[Service]
# The only role that needs the rootless parser socket under /run/user.
# Every service/private directory remains0700 under its own distinct UID.
ProtectHome=read-only
# Cleanup is independent of operating expiry and runs even after the worker cgroup is killed.
ExecStartPre=/usr/bin/node --import tsx scripts/parent-hosted-services.ts /etc/caselink/worker/profile.json parser-cleanup
ExecStopPost=/usr/bin/node --import tsx scripts/parent-hosted-services.ts /etc/caselink/worker/profile.json parser-cleanup
TimeoutStartSec=30
TimeoutStopSec=20
