<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You've been invited to CaseLink</title>
  <style type="text/css">
    body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
    table { border-collapse: collapse; }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f0ff; font-family: Arial, sans-serif; color: #102052;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f4f0ff">
    <tr>
      <td align="center" style="padding: 48px 20px;">
        <!--[if mso]><table role="presentation" width="440" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 440px; border-collapse: separate; border-spacing: 0;">
          <tr>
            <td align="center" style="padding: 0 0 24px;">
              <p style="margin: 0; font-family: 'Newsreader Variable', Georgia, serif; font-size: 28px; line-height: 1.2; color: #102052;">CaseLink</p>
            </td>
          </tr>
          <tr>
            <td align="center" bgcolor="#fffefe" style="padding: 40px 28px; border: 1px solid #ded8f4; border-radius: 16px;">
              <h1 style="margin: 0 0 28px; font-family: 'Newsreader Variable', Georgia, serif; font-size: 28px; font-weight: 400; line-height: 1.25; color: #102052;">You've been invited to CaseLink.</h1>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" bgcolor="#4932c6" style="border-radius: 10px;">
                    <a href="{{ .SiteURL }}/auth/callback#token_hash={{ .TokenHash }}&amp;type=invite&amp;next=%2Freset-password%3Fmode%3Dsetup" style="display: inline-block; padding: 14px 24px; border: 1px solid #4932c6; border-radius: 10px; font-family: Arial, sans-serif; font-size: 16px; font-weight: 600; line-height: 20px; color: #fffefe; text-decoration: none;">Accept invitation</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
